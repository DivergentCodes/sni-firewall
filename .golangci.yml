version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - misspell
    - unconvert
  settings:
    errcheck:
      # A failed Close on a socket or file being torn down has no recovery.
      exclude-functions:
        - (net.Conn).Close
        - (net.Listener).Close
        - (*crypto/tls.Conn).Close
        - (*os.File).Close

formatters:
  enable:
    - gofmt
